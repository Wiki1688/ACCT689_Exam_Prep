m Q17)", "dr": "Sales Returns and Allowances 400", "cr": "Accounts Receivable 400"}, {"event": "Customer pays 15,000 within 1/10 n/30 (sample Q38)", "dr": "Cash 14,850; Sales Discounts 150", "cr": "Accounts Receivable 15,000"}, {"event": "Piper: 1,500 sale, 500 returned, 2% discount", "dr": "Cash 980; Sales Returns 500; Sales Discounts 20", "cr": "Accounts Receivable 1,500"}, {"event": "Net sales (sample Q36)", "dr": "500,000 - 18,000 - 7,000 - 5,000", "cr": "= 470,000"}]}, "tip": "Credit terms: 2/10, n/30 = 2% off within 10 days, else full in 30. 1/15, n/45 = 1% within 15 days. 15 E.O.M. = due 15 days after month end.", "trap": "Sample Q38 distractor debits Inventory for the discount; sample Q36 distractors add freight-in or interest.", "notes": "Keeping contra accounts separate shows how much revenue was given back; Sales Revenue itself is never debited for a return. Net sales is before COGS; net sales minus COGS is gross profit. A check received within the discount window is cash, not a note."}, {"id": "T5-04", "topic": "T5", "title": "Who owns the goods in transit?", "kind": "concept", "bullets": ["Count inventory by legal title, not physical location", "FOB shipping point: buyer owns once goods leave the seller", "FOB destination: seller owns until goods arrive", "Consignor (owner) keeps consigned goods in inventory; consignee excludes them", "FOB destination seller recognises revenue on arrival"], "visual": {"type": "table", "header": ["Situation", "Who counts it", "Delta Q41 effect"], "rows": [["Purchased FOB shipping point, in transit", "Buyer", "+25,000"], ["Sold FOB destination, in transit", "Seller", "+10,000"], ["Goods held on consignment for others", "Consignor, not us", "-15,000"], ["Our goods out on consignment", "Us (consignor)", "include"], ["Delta: count 200,000", "Correct ending inventory", "220,000"]]}, "tip": "E8-2: count 594,000 + 50,000 (bought FOB SP) + 70,000 (sold FOB dest) = 714,000.", "trap": "Midterm Q29: under FOB destination the seller recognises revenue when goods reach the buyer.", "notes": "'FOB' means free on board; the word after it tells you where ownership changes hands. The consignee holds the goods but never owned them (midterm Q8: the consignor keeps them as inventory on its balance sheet)."}, {"id": "T5-05", "topic": "T5", "title": "FIFO, LIFO, moving average: recipes", "kind": "concept", "bullets": ["Perpetual: work date by date; use only layers on hand at the sale", "FIFO: oldest layer out first; ending inventory = newest costs", "LIFO: newest layer on hand out first; ending inventory = oldest costs", "Moving average: recompute after every purchase; sales at current average", "Control: COGS + ending inventory = cost available; units must tie"], "visual": {"type": "compare", "columns": [{"title": "FIFO", "lines": ["3 @ 10 + 5 @ 12, sell 4", "COGS 3x10 + 1x12 = 42", "EI 4 x 12 = 48; GP 38"]}, {"title": "LIFO", "lines": ["Newest first", "COGS 4 x 12 = 48", "EI 3x10 + 1x12 = 42; GP 32"]}, {"title": "Average", "lines": ["90 / 8 = 11.25 per unit", "COGS 4 x 11.25 = 45", "EI 45; GP 35"]}]}, "tip": "Write units available, units sold, cost available FIRST. Then the method.", "trap": "Periodic LIFO and periodic average answers are always among the distractors.", "notes": "Midterm Q3: LIFO assumes the most recently acquired items are sold first. Under perpetual LIFO you cannot reach forward to a purchase made after the sale date. Keep four decimals for moving average or the control check will not tie. Singapore and IFRS do not permit LIFO; FIFO and weighted average are used."}, {"id": "T5-06", "topic": "T5", "title": "Exercise: HSC clocks (in-class)", "kind": "exercise", "bullets": ["Begin 9 at 60; sell 5; buy 4 at 60; sell 5", "Then buy 10 at 70; sell 8; buy 3 at 80", "Available 26 units, 1,720; sold 18; ending 8", "Find COGS and ending inventory under each method"], "visual": {"type": "table", "header": ["Sale", "FIFO", "LIFO", "Moving average"], "rows": [["Oct 5 (5)", "5 x 60 = 300", "5 x 60 = 300", "300.00"], ["Oct 10 (5)", "5 x 60 = 300", "5 x 60 = 300", "300.00"], ["Oct 23 (8)", "3x60 + 5x70 = 530", "8 x 70 = 560", "8 x 67.6923 = 541.54"], ["Total COGS", "1,130", "1,160", "1,141.54"], ["Ending inventory (8)", "5x70 + 3x80 = 590", "3x60 + 2x70 + 3x80 = 560", "578.46"], ["Check: COGS + EI", "1,720", "1,720", "1,720"]]}, "tip": "Oct 15 average = (3 x 60 + 10 x 70) / 13 = 67.6923; Oct 26 average = (338.46 + 240) / 8 = 72.31.", "notes": "Rising prices here: FIFO gives the lowest COGS and highest ending inventory and profit; LIFO the opposite; average in between. The revenue entry is identical under all methods; only Dr COGS / Cr Inventory changes."}, {"id": "T5-07", "topic": "T5", "title": "Exercise: Iliescu and Brightwave pairs", "kind": "exercise", "bullets": ["Iliescu: 70@100, sell 50, 46@104, sell 59, 62@110, sell 56, 18@112", "Brightwave: 200 @ 10; 300 @ 12; sell 400; 200 @ 13; sell 150", "'Use the following information for the next two questions'", "Expect this pair format again on the final"], "visual": {"type": "table", "header": ["Question", "Working", "Answer"], "rows": [["Iliescu perpetual LIFO COGS", "5,000 + (4,784 + 1,300) + 6,160", "17,244"], ["Iliescu perpetual FIFO EI (31 units)", "18 x 112 + 13 x 110", "3,446"], ["Brightwave moving-average EI", "avg 11.20, 100 left; (1,120 + 2,600)/300 = 12.40 x 150", "1,860"], ["Brightwave perpetual LIFO COGS", "300x12 + 100x10 + 150x13", "6,550"], ["Control Iliescu", "196 available - 165 sold = 31; cost 20,620", "ties"]]}, "tip": "Sample Q9 distractors: 6,250 = FIFO, 6,340 = moving average, 6,443 = periodic average.", "notes": "Iliescu LIFO sale 2 uses 46 @ 104 then 13 of the remaining 20 @ 100; sale 3 uses 56 of the 62 @ 110. Brightwave: after Mar 5, 500 units cost 5,600 (11.20); sell 400 leaves 100 (1,120); add 200 @ 13 gives 300 units 3,720 (12.40); sell 150 leaves 1,860. AP18 (moving average): final average 47.54, EI 12,360."}, {"id": "T5-08", "topic": "T5", "title": "Rising vs falling prices", "kind": "concept", "bullets": ["Rising prices: FIFO lowest COGS, highest EI, highest NI", "Rising prices: LIFO highest COGS, lowest EI, lowest NI", "Falling prices flip every ranking", "Average always sits in between", "Flat prices: all methods agree; random prices: compute"], "visual": {"type": "grid2x2", "rowLabels": ["Prices rising", "Prices falling"], "colLabels": ["FIFO", "LIFO"], "cells": [["COGS lowest, EI highest, NI highest", "COGS highest, EI lowest, NI lowest"], ["COGS highest, EI lowest, NI lowest", "COGS lowest, EI highest, NI highest"]]}, "tip": "Three switches to read: rising/falling, highest/lowest, COGS/EI/NI.", "trap": "Sample Q34: falling prices, highest EI = LIFO. Midterm Q28: falling prices, lowest COGS = LIFO.", "notes": "COGS and ending inventory always add to the same cost available, so what one method pushes into COGS it leaves out of inventory. LIFO matches current costs to current revenue but leaves a stale balance sheet; FIFO does the reverse. Higher COGS means lower profit and lower tax, which is why some US firms choose LIFO in inflation. LIFO is banned under IFRS."}, {"id": "T5-09", "topic": "T5", "title": "T5 traps", "kind": "trap", "bullets": ["Perpetual: returns, allowances, discounts all credit Inventory", "Freight-in to Inventory; freight-out to Delivery Expense", "Allowance (goods kept) and discounts: no COGS entry", "Perpetual LIFO: only layers on hand at the sale date", "Falling prices flip FIFO/LIFO; read all three switches"], "visual": {"type": "cards", "items": [{"title": "Count correction", "text": "Add FOB shipping-point purchases in transit; add FOB destination sales in transit; remove goods held on consignment."}, {"title": "Net sales", "text": "Gross minus returns, allowances, discounts. Not freight, not interest, not COGS."}, {"title": "Credit terms", "text": "First number = discount %, second = days, n/xx = final due date."}, {"title": "Control total", "text": "COGS + EI = cost available. If it does not tie, redo."}]}, "notes": "Prof Lin's inventory distractors are the other methods' answers and the periodic versions. The false statements are freight-out in inventory, a Purchase Returns account under perpetual, and debiting Inventory for a sales discount."}, {"id": "T5-10", "topic": "T5", "title": "T5 summary", "kind": "summary", "bullets": ["Memorise: six perpetual entries and the sales-side entries", "Memorise: cost in/out list, FOB rules, consignment", "Memorise: three method recipes and the control check", "Memorise: rising/falling grid", "Likely short answer: FIFO vs LIFO in inflation; why LIFO is banned"], "visual": {"type": "steps", "items": ["Define: FIFO expenses oldest costs, LIFO expenses newest costs", "Example: 3 @ 10 and 5 @ 12, sell 4: FIFO COGS 42 vs LIFO 48; NI differs by 6", "Why: in inflation LIFO lowers profit and tax but leaves stale inventory values; IFRS bans LIFO for that reason"]}, "notes": "Second likely short answer: what does net sales mean? Define: gross sales less returns, allowances and discounts. Example: 500,000 - 18,000 - 7,000 - 5,000 = 470,000. Why: contra-revenue accounts show how much revenue was given back, a signal of product quality and credit policy."}, {"id": "T6-00", "topic": "T6", "title": "T6 PP&E and intangibles", "kind": "section", "bullets": ["15 marks, about 10 questions; half numeric, half conceptual", "Tested: cost of PP&E and land, basket purchase, capitalise vs expense", "Tested: straight-line partial year, contra-asset, disposal gain/loss", "Tested: amortisation, goodwill, R&D under IFRS, impairment idea only", "In-class: Rosenberg, Bodie, Ace, Maxwell, SMU Co, ABC sprinkler, Kettle Chips"], "notes": "Only straight-line depreciation is tested. Impairment calculations, units-of-production and double-declining are not tested, but know that impairment exists to avoid overstating assets and net income. Expect a linked pair: depreciation then gain or loss on sale."}, {"id": "T6-01", "topic": "T6", "title": "Cost of PP&E: everything to get ready", "kind": "concept", "bullets": ["Cost = everything to bring the asset to its intended use", "Land: price, legal fees, title, demolition net of salvage, grading", "Equipment: price net of discount, freight, insurance in transit, installation, testing", "Out: training, launch party, annual insurance, post-purchase property tax", "Freehold land is never depreciated"], "visual": {"type": "table", "header": ["Exercise", "Include", "Exclude", "Answer"], "rows": [["SMU Co land", "380,000 + tax at purchase 2,000 + title 3,000 + clear 5,000", "", "390,000"], ["SMU Co building", "Construction 500,000", "", "500,000 (depreciated)"], ["ABC sprinkler", "17,000 net + 1,000 + 2,000 dismantle + 3,000 install", "Party 4,000, training 5,000, annual insurance 6,000", "23,000"], ["Granite land (Q30)", "400,000 + 6,000 + 25,000 - 3,000 + 8,000", "Post-purchase tax 4,000", "436,000"]]}, "trap": "Demolishing an old building goes to LAND, not the new building. Interest during construction goes to the building.", "notes": "Paying with a note instead of cash does not change the cost. A trade discount reduces the cost; use the net price. Anything after the asset is ready for use (training, repairs, annual insurance) is an expense. Sample Q30 distractors: forget to deduct salvage (439,000), add the tax (440,000)."}, {"id": "T6-02", "topic": "T6", "title": "Basket purchase: relative market value", "kind": "formula", "bullets": ["One price for several assets: allocate by relative MARKET value", "Each cost = total price x (its market value / total market value)", "Ignore the seller's book values, even if they add up to the price", "Rosenberg: 180,000 for land 75,000, building 100,000, equipment 50,000 MV", "Henner: machine C = 40,500 / 81,000 x 72,000 = 36,000"], "visual": {"type": "table", "header": ["Asset", "Market value", "Share", "Cost allocated"], "rows": [["Land", "75,000", "1/3", "60,000"], ["Building", "100,000", "4/9", "80,000"], ["Equipment", "50,000", "2/9", "40,000"], ["Total", "225,000", "", "180,000"]]}, "tip": "Entry: Dr Land 60,000; Dr Building 80,000; Dr Equipment 40,000 / Cr Cash 180,000.", "trap": "Rosenberg's seller carrying amounts (30,000 / 90,000 / 60,000) total exactly 180,000. That is the trap.", "notes": "Slide example: 2,800,000 for land (MV 300,000) and building (MV 2,700,000): land 10% = 280,000, building 90% = 2,520,000. The allocated amount becomes each asset's cost for depreciation."}, {"id": "T6-03", "topic": "T6", "title": "Capitalise or expense?", "kind": "concept", "bullets": ["Ask: does it increase capacity, efficiency or useful life?", "Yes: capital expenditure, debit the asset (overhaul, body modification, extension)", "No: expense now (repairs, oil change, tyres, paint)", "Capitalising raises assets and NI this year; expensing lowers both", "Wrongly expensing a capital item: assets AND NI understated"], "visual": {"type": "grid2x2", "rowLabels": ["Should capitalise", "Should expense"], "colLabels": ["Recorded as asset", "Recorded as expense"], "cells": [["Correct", "Assets understated, NI understated (sample Q5)"], ["Assets overstated, NI overstated (WorldCom 3.8bn)", "Correct"]]}, "trap": "Sample Q5: 30,000 overhaul extending life, expensed in error: assets understated, NI understated.", "notes": "WorldCom capitalised 3.8 billion of operating costs, so expenses were understated and assets and profit overstated; the CEO got 25 years. The distinction needs judgment: an engine overhaul extends life (capitalise); a transmission repair restores working order (expense). Repairs never appear in the depreciation schedule."}, {"id": "T6-04", "topic": "T6", "title": "Straight-line and the partial year", "kind": "formula", "bullets": ["Annual depreciation = (Cost - Residual) / Useful life", "Partial year: annual amount x months in use / 12", "Wheeler van: (24,000 - 2,000) / 4 = 5,500; bought July 1: 2,750", "Miles driven is a distractor for straight line", "Book value = Cost - Accumulated Depreciation, ends at residual"], "visual": {"type": "equation", "text": "Depreciation = (Cost - Residual value) / Useful life x months / 12", "sub": "Rapid Deliveries truck: (16,800 - 1,200) / 4 x 6/12 = 1,950"}, "tip": "Sample Q37: (120,000 - 12,000)/10 = 10,800 a year; Apr 2025 to Dec 2026 = 21 months = 18,900; carrying amount 101,100.", "trap": "Distractors: whole years instead of months; forgetting to subtract residual.", "notes": "Three estimates drive depreciation: cost, useful life, residual (salvage) value. Depreciable cost = cost minus residual. The method must reflect how the asset's benefits are consumed and be used consistently; about 90% of IFRS companies use straight line. Depreciation is matching: the cost is moved to expense as the asset helps earn revenue."}, {"id": "T6-05", "topic": "T6", "title": "Depreciation entry and the contra-asset", "kind": "je", "bullets": ["Dr Depreciation Expense / Cr Accumulated Depreciation", "Accumulated Depreciation: contra-asset, credit balance, never a liability", "PP&E net = Cost - Accumulated Depreciation = carrying amount", "Why not credit PP&E directly? Keep actual cost separate from the estimate", "Same logic as the Allowance for bad debts"], "visual": {"type": "tacct", "title": "Equipment 10,000 less Accumulated Depreciation", "left": ["Equipment cost 10,000 (actual)"], "right": ["Accumulated Depreciation 1,000 (estimate)"], "balance": "PP&E, net 9,000 = book value"}, "tip": "Sample Q23 answer: keep the original cost in the records while showing total depreciation, because depreciation is an estimate.", "trap": "Practice Q10: Accumulated Depreciation is credited when the year's depreciation is recorded, debited on disposal.", "notes": "Balance sheet shows Building 120,000 less accumulated depreciation (80,000) = 40,000 carrying amount. The depreciation entry is an end-of-period adjusting entry. Users can see both the historical cost and how much has been used up, and can judge how old the assets are."}, {"id": "T6-06", "topic": "T6", "title": "Exercise: Rosenberg depreciation 2025", "kind": "exercise", "bullets": ["Purchased April 1, 2025; year-end December 31 (9 months)", "Building 80,000, 20 years, no salvage", "Equipment 40,000, 4 years, salvage 2,000", "Land 60,000: no depreciation"], "visual": {"type": "table", "header": ["Asset", "Annual", "x 9/12", "2025 expense"], "rows": [["Building", "80,000 / 20 = 4,000", "9/12", "3,000"], ["Equipment", "(40,000 - 2,000) / 4 = 9,500", "9/12", "7,125"], ["Land", "none", "", "0"]]}, "tip": "Entry: Dr Depreciation Expense 10,125 / Cr Accumulated Depreciation, Building 3,000 and Equipment 7,125.", "notes": "Count months from the purchase date to year-end: April to December is nine months. Subtract the residual before dividing. The equipment's accumulated depreciation of 7,125 carries into the 2026 disposal exercise."}, {"id": "T6-07", "topic": "T6", "title": "Disposal: three steps", "kind": "concept", "bullets": ["Step 1: record depreciation up to the disposal date", "Step 2: book value = cost - accumulated depreciation to date", "Step 3: gain if proceeds exceed book value; loss if below", "Entry: Dr Cash, Dr Acc Dep, Dr Loss / Cr Asset cost, Cr Gain", "Scrapped with no proceeds: loss = remaining book value"], "visual": {"type": "steps", "items": ["Update depreciation to the sale date (months / 12)", "Compute book value = cost - total accumulated depreciation", "Gain or loss = proceeds - book value", "Remove the asset at COST and all its accumulated depreciation"]}, "tip": "Wheeler sale: cost 24,000, acc dep 18,000, sold 5,000: Dr Cash 5,000, Dr Acc Dep 18,000, Dr Loss 1,000 / Cr Truck 24,000.", "trap": "Sample Q28 distractor forgets the final half-year: BV 44,000 gives loss 4,000 instead of gain 2,000.", "notes": "Fully depreciated asset with zero residual scrapped: no gain or loss. Wheeler scrapped after six years with 3,000 book value: Dr Accumulated Depreciation 21,000, Dr Loss 3,000 / Cr Truck 24,000. The gain or loss is peripheral, so it is a gain or loss, not revenue."}, {"id": "T6-08", "topic": "T6", "title": "Exercise: Rosenberg sale, Maxwell, Quill", "kind": "exercise", "bullets": ["Rosenberg: equipment 40,000 sold July 1, 2026 for 10,000", "Maxwell: fixtures 8,800, 5 years, residual 1,300; sold Aug 31, 2026 for 2,900", "Quill Q28: machine 80,000, 6 years, residual 8,000; sold July 1, 2026 for 40,000", "Find updated depreciation, book value, gain or loss"], "visual": {"type": "table", "header": ["Case", "Depreciation to date", "Book value", "Gain / (loss)"], "rows": [["Rosenberg (Jan-Jun 2026 = 4,750)", "7,125 + 4,750 = 11,875", "28,125", "(18,125)"], ["Maxwell (2025 1,500; 2026 8 months 1,000)", "2,500", "6,300", "(3,400)"], ["Quill (12,000 x 3.5 years)", "42,000", "38,000", "2,000 gain"]]}, "tip": "Rosenberg entry: Dr Cash 10,000; Dr Acc Dep 11,875; Dr Loss 18,125 / Cr Equipment 40,000.", "notes": "Maxwell: annual (8,800 - 1,300)/5 = 1,500; 2026 is eight months so 1,000; entries Dr Depreciation Expense 1,000 / Cr Acc Dep 1,000 then Dr Cash 2,900, Dr Acc Dep 2,500, Dr Loss 3,400 / Cr Fixtures 8,800. Quill: Jan 2023 to July 2026 is 3.5 years at 12,000."}, {"id": "T6-09", "topic": "T6", "title": "Change in estimate: Bodie and Ace", "kind": "concept", "bullets": ["Useful life and residual are estimates; revise when information changes", "No restatement of prior years; apply going forward", "New annual = (book value at change - new residual) / REMAINING life", "Bodie: 'total life 6 years' at start of year 3 means 4 years remain", "Ace: 15 more years after 20 years used"], "visual": {"type": "table", "header": ["Case", "Book value at change", "New base", "New annual"], "rows": [["Bodie: 200,000, 8 yrs, 40,000 salvage; year 3 change", "200,000 - 2 x 20,000 = 160,000", "160,000 - 0", "160,000 / 4 = 40,000"], ["Ace: 435,000, 40 yrs, 73,000 residual; year 21", "435,000 - 20 x 9,050 = 254,000", "254,000 - 14,000 = 240,000", "240,000 / 15 = 16,000"], ["Wheeler: after 3 yrs, 3 more yrs, 3,000 salvage", "7,500", "7,500 - 3,000", "4,500 / 3 = 1,500"]]}, "trap": "Remaining life = new total life minus years already used, not the new total.", "notes": "Two-step method: derive the book value at the date of change, then spread (book value minus new residual) over the remaining new life. Prior statements are not changed because they used the best information at the time."}, {"id": "T6-10", "topic": "T6", "title": "Intangibles: finite vs indefinite life", "kind": "concept", "bullets": ["Cost includes all costs to purchase or develop, including registration fees", "Finite life: straight line, zero residual, SHORTER of legal and useful life", "Entry: Dr Amortisation Expense / Cr Patent (or Accumulated Amortisation)", "Indefinite life (goodwill, some trademarks): no amortisation, annual impairment test", "Only purchased brands are recognised; internal brands are not"], "visual": {"type": "compare", "columns": [{"title": "Finite life", "lines": ["Patents, copyrights, licences", "Nimbus Q27: (180,000 + 12,000) / 8 = 24,000", "Shorter of 15 legal and 8 useful"]}, {"title": "Indefinite life", "lines": ["Goodwill, some trademarks", "Not amortised", "Impairment test every year to avoid overstating assets and NI"]}]}, "trap": "Sample Q48 false option: indefinite-life trademark amortised over 40 years.", "notes": "Q27 distractors: 180,000/15 = 12,000; 192,000/15 = 12,800; 180,000/8 = 22,500. Intangibles are measured at cost, not value. Reputation, human capital and management skill are never assets because they cannot be measured reliably."}, {"id": "T6-11", "topic": "T6", "title": "Goodwill and R&D", "kind": "formula", "bullets": ["Goodwill = purchase price - market value of net assets", "Net assets = MARKET value of assets - liabilities", "Recorded only when buying another company; never amortised", "IFRS: research costs expensed; development costs capitalised when criteria met", "US GAAP expenses all R&D"], "visual": {"type": "equation", "text": "Goodwill = Price paid - (Fair value of assets - Liabilities)", "sub": "Kettle Chips: 9 - (15 - 10) = 4m. Atlas Q14: 5,200,000 - (5,100,000 - 1,500,000) = 1,600,000"}, "tip": "Entry (millions): Dr Assets 15; Dr Goodwill 4 / Cr Liabilities 10; Cr Cash 9.", "trap": "Q14 distractor uses BOOK value of assets (4,000,000) and gets 2,700,000.", "notes": "Goodwill represents the earning power the acquirer paid for; usually the acquirer overpays. It is tested for impairment annually so assets and net income are not overstated. Research is expensed because feasibility and future benefit are uncertain; development is capitalised because there is more certainty."}, {"id": "T6-12", "topic": "T6", "title": "T6 traps", "kind": "trap", "bullets": ["Count months before computing book value at disposal", "Land cost: demolition net of salvage in; post-purchase tax out", "Basket purchase: market values, never seller's book values", "Goodwill uses FAIR value of net assets", "Amortise over the SHORTER life; include registration fees"], "visual": {"type": "cards", "items": [{"title": "Capitalise vs expense", "text": "Expensing a capital item: assets and NI understated. Capitalising an expense: both overstated."}, {"title": "Contra-asset", "text": "Accumulated Depreciation is not a liability and not cash set aside."}, {"title": "Not amortised", "text": "Goodwill and indefinite-life intangibles: impairment test instead."}, {"title": "Remaining life", "text": "New total life minus years used."}]}, "notes": "Half the T6 questions are numeric with one classic wrong method each. Before computing, write the months on scrap paper and the formula you will use."}, {"id": "T6-13", "topic": "T6", "title": "T6 summary", "kind": "summary", "bullets": ["Memorise: cost in/out list; relative market value allocation", "Memorise: straight-line formula with months/12; depreciation entry", "Memorise: disposal three steps; goodwill formula; amortisation rule", "Memorise: research expensed, development capitalised (IFRS)", "Likely short answer: why use Accumulated Depreciation, not credit PP&E?"], "visual": {"type": "steps", "items": ["Define: Accumulated Depreciation is a contra-asset showing total depreciation to date", "Example: Equipment 10,000 less Accumulated Depreciation 1,000 = PP&E net 9,000; Dr Depreciation Expense / Cr Accumulated Depreciation", "Why: depreciation is an estimate; keeping it separate preserves the actual cost, like the Allowance for A/R"]}, "notes": "Second likely short answer: why test goodwill for impairment annually and why IFRS treats research and development differently? Define: indefinite-life assets are not amortised, so an annual test stops assets and NI being overstated. Example: Dr Impairment Loss / Cr Accumulated Impairment. Why: research has uncertain future benefit (expense), development has greater certainty (capitalise)."}, {"id": "T7-00", "topic": "T7", "title": "T7 Liabilities", "kind": "section", "bullets": ["15 marks, about 10 questions; half numeric, half conceptual", "Tested: spot a liability, estimates, accrued interest and salaries, unearned revenue", "Tested: current portion of LTD, warranty, contingency flowchart", "Tested: bond premium/discount, instalment note split, lease basics", "In-class: NewsWeek, Ross warranty, ABC instalment table, three contingency cases"], "notes": "The Key Learning Points doc calls this Topic 8. Not tested: present value calculations, bond price computation, splitting warranty into current and non-current, detailed lease calculations. The direction of premium or discount IS tested ('Will be tested!!' on slide 31)."}, {"id": "T7-01", "topic": "T7", "title": "Spot a liability by its name", "kind": "concept", "bullets": ["Liability: present obligation from a past event to transfer resources", "Names with 'payable', 'provision', 'unearned', 'accrued' are liabilities", "Current: due within one year or the operating cycle, whichever is LONGER", "Known amounts: A/P, notes, salaries, interest, sales tax, unearned revenue", "Estimated amounts: warranty provision, provisions for lawsuits"], "visual": {"type": "table", "header": ["Liability", "Owed to", "Known or estimated"], "rows": [["Accounts payable", "Suppliers", "Known"], ["Notes payable, interest payable", "Creditors, banks", "Known"], ["Salaries payable", "Employees", "Known"], ["Sales tax payable", "Government", "Known"], ["Unearned revenue", "Customers (goods or services owed)", "Known"], ["Provision for warranty", "Customers", "Estimated"]]}, "trap": "Unearned revenue is a liability, not revenue; dividends payable exists only after declaration.", "notes": "Why record an estimated liability and expense rather than wait? Matching: the warranty cost belongs to the period of the sale that caused it, just like bad debts. Waiting for the actual repair bill would overstate this year's profit and push the cost into a later year."}, {"id": "T7-02", "topic": "T7", "title": "Accrued interest and salaries", "kind": "je", "bullets": ["Interest rate quoted is ANNUAL; pro-rate by months", "Year-end: Dr Interest Expense / Cr Interest Payable", "Payment next year: Dr Note, Dr Interest Payable, Dr Interest Expense / Cr Cash", "Salaries earned, paid next period: Dr Salary Expense / Cr Salaries Payable", "These are 'cash later' accruals from Topic 3"], "visual": {"type": "je", "rows": [{"event": "Apr 1: buy inventory with 8,000 10% one-year note", "dr": "Inventory 8,000", "cr": "Notes Payable 8,000"}, {"event": "Dec 31: accrue 9 months 8,000 x 10% x 9/12", "dr": "Interest Expense 600", "cr": "Interest Payable 600"}, {"event": "Mar 31: pay at maturity (3 more months = 200)", "dr": "Notes Payable 8,000; Interest Payable 600; Interest Expense 200", "cr": "Cash 8,800"}, {"event": "Fern Q25: 120,000 x 6% x 4/12 at Dec 31", "dr": "Interest Expense 2,400", "cr": "Interest Payable 2,400"}, {"event": "Salaries earned 750, paid Jan 3", "dr": "Salary Expense 750", "cr": "Salaries Payable 750"}]}, "trap": "Q25 distractors: 5,400 (full 9 months), Cr Notes Payable (wrong account), reversed entry.", "notes": "This mirrors the note receivable in T4 from the borrower's side. Interest expense lowers equity; interest payable raises liabilities. At payment, last year's accrued interest goes through Interest Payable and this year's portion through Interest Expense. Total interest 800 = 600 + 200."}, {"id": "T7-03", "topic": "T7", "title": "Exercise: NewsWeek (in-class)", "kind": "exercise", "bullets": ["May 1 2026: equipment 15,000 by one-year 8% note", "Oct 1: six-month subscription, cash 218 including 9% sales tax", "Nov 15: pay sales tax; Dec 31: accrue interest, record revenue earned", "May 1 2027: pay the note at maturity"], "visual": {"type": "je", "rows": [{"event": "May 1: buy equipment with note", "dr": "Equipment 15,000", "cr": "Notes Payable 15,000"}, {"event": "Oct 1: 218 / 1.09 = 200 sales; tax 18", "dr": "Cash 218", "cr": "Unearned Revenue 200; Sales Tax Payable 18"}, {"event": "Nov 15: remit tax", "dr": "Sales Tax Payable 18", "cr": "Cash 18"}, {"event": "Dec 31: interest 15,000 x 8% x 8/12", "dr": "Interest Expense 800", "cr": "Interest Payable 800"}, {"event": "Dec 31: 3 of 6 months earned", "dr": "Unearned Revenue 100", "cr": "Subscription Revenue 100"}, {"event": "May 1 2027: pay note (4 months = 400)", "dr": "Notes Payable 15,000; Interest Payable 800; Interest Expense 400", "cr": "Cash 16,200"}]}, "tip": "'Collected X including GST' means split: sales = X / (1 + rate). 'Earned X' means add tax on top.", "trap": "218 x 9% = 19.62 is wrong; the tax is inside the 218. Sales tax is never revenue.", "notes": "Each entry's effect on A = L + SE: equipment purchase A up L up; cash with tax A up L up L up; remit tax A down L down; interest accrual L up SE down; revenue earned L down SE up; note payment A down 16,200, L down 15,800, SE down 400. Slide 9 example: earned 200,000 at 5% tax: Dr Cash 210,000 / Cr Sales 200,000 / Cr Sales Tax Payable 10,000."}, {"id": "T7-04", "topic": "T7", "title": "Current portion of long-term debt", "kind": "concept", "bullets": ["Long-term debt repaid in instalments", "Principal due within 12 months is reclassified to current", "The rest stays long-term; interest payable is shown separately", "Each year-end the next instalment moves to current", "Do not classify the whole loan as current"], "visual": {"type": "table", "header": ["Slide 11 balance sheet (Dec 31, 2025)", "Amount"], "rows": [["Accounts payable", "650"], ["Accrued liabilities", "985"], ["Unearned revenue", "877"], ["Current portion of long-term debt", "225"], ["Long-term debt (2,685 total less 225 current)", "2,460"]]}, "tip": "ABC note at Dec 31, 2026: 88,700 due Jan 1, 2027 is current; 411,300 is long-term.", "trap": "Sample Q24 true option: the portion of a bank loan due within 12 months is current. Interest frequency is irrelevant.", "notes": "A loan taken 1 Jan 2025 with payments each 31 Dec 2025 to 2029: at 31 Dec 2025 the 2026 principal is current, 2027 to 2029 remain long-term. Only principal moves; accrued interest is a separate accrued liability."}, {"id": "T7-05", "topic": "T7", "title": "Warranty: estimate at sale, pay later", "kind": "je", "bullets": ["Warranty expense is estimated in the year of sale (matching)", "At sale: Dr Warranty Expense / Cr Provision for Warranty Repairs", "At claim: Dr Provision / Cr Inventory (parts) or Cash; NO expense", "Ending provision = beginning + expense - claims paid", "Course assumption: all warranty provisions are current"], "visual": {"type": "tacct", "title": "Provision for Warranty Repairs (Ross Inc.)", "left": ["Claims paid 7,000"], "right": ["Beg 3,000", "Expense 6% x 100,000 = 6,000"], "balance": "End 2,000 (credit)"}, "tip": "Pinecrest Q12: expense 3% x 800,000 = 24,000; liability 6,000 + 24,000 - 15,000 = 15,000.", "trap": "Ross: 2026 warranty EXPENSE is 6,000 (the estimate), not the 7,000 cash paid.", "notes": "Q12 distractors: liability = beginning (6,000), liability = expense (24,000), liability = beginning + expense (30,000). A negative warranty expense is possible under IFRS: when claims turn out lower than expected the provision is reduced with Dr Provision / Cr Warranty Expense. More sales raise the liability; actual claims reduce it."}, {"id": "T7-06", "topic": "T7", "title": "Contingent liability flowchart", "kind": "concept", "bullets": ["Test 1: present obligation (we know we are responsible) or only possible?", "Test 2: payment probable (over 50%), reasonably possible, or remote?", "Test 3: can the amount be estimated reliably?", "Record a provision: present obligation + probable + reliable estimate", "Disclose only: possible but not remote, or probable but not estimable. Remote: nothing"], "visual": {"type": "flow", "nodes": ["Present obligation from past event?", "Probable (>50%)?", "Reliable estimate?", "(1) Record provision"], "labels": ["yes", "yes", "yes"]}, "tip": "Record the BEST ESTIMATE (400,000), not the amount claimed (500,000). Never record 50% of the loss.", "trap": "Sample Q31: reasonably possible 2m loss = disclose in notes, no liability (not 'nothing', not 1m).", "notes": "Path (2) disclose: a possible obligation that is not remote; a present obligation where payment is not probable; a present obligation that cannot be measured reliably (extremely rare in practice). Path (3) neither: payment remote. Bad publicity does not change the answer if the legal assessment is unchanged. A virtually certain law or a specific public promise creates a present (constructive) obligation. Reassess every reporting date."}, {"id": "T7-07", "topic": "T7", "title": "Exercise: three contingency cases", "kind": "exercise", "bullets": ["Case 1: ex-employee sues 200,000; dismissal lawful; payment remote", "Case 2 patent suit 500,000: A disputed; B 60%, estimate 400,000; C not estimable", "Case 3 clean-up 2m: A law virtually certain; B public promise; C neighbour maybe", "Answer: (1) provision, (2) disclose, or (3) neither"], "visual": {"type": "table", "header": ["Case", "Analysis", "Answer"], "rows": [["1 Lawsuit, remote", "Possible obligation, payment remote; media coverage changes nothing", "(3) Neither"], ["2A Responsibility uncertain, not remote", "Possible obligation", "(2) Disclose"], ["2B Probable 60%, estimate 400,000", "Present obligation, probable, reliable", "(1) Provision 400,000"], ["2C Probable, no reliable estimate", "Cannot record", "(2) Disclose"], ["3A Law virtually certain; 3B public promise", "Present or constructive obligation, probable, 2m estimate", "(1) Provision 2m"], ["3C Unlikely responsible, not remote", "Possible obligation", "(2) Disclose"]]}, "tip": "Entry for a provision: Dr Loss (expense) 400,000 / Cr Provision for Lawsuit 400,000.", "notes": "Prof's labels: (1) record a provision, (2) disclose a contingent liability, (3) neither. 'Present obligation' means the company knows it is responsible; 'possible obligation' means responsibility is uncertain. A provision is a liability; probable means more likely than not."}, {"id": "T7-08", "topic": "T7", "title": "Bonds: premium, par or discount", "kind": "concept", "bullets": ["Compare the stated (coupon) rate with the market rate", "Stated above market: premium, cash received more than face", "Stated equal to market: issued at face (par)", "Stated below market: discount, cash received less than face", "Price calculation is NOT tested; the direction IS"], "visual": {"type": "table", "header": ["Stated vs market", "Sells at", "Cash received"], "rows": [["Stated 7%, market 6%", "Premium", "More than face value"], ["Stated 6%, market 6%", "Par (face)", "Equal to face value"], ["Stated 5%, market 6% (sample Q17)", "Discount", "Less than 1,000,000"]]}, "tip": "Vocabulary: face = par = principal = maturity value; coupon = stated = nominal rate; debenture = unsecured.", "trap": "The coupon cash payment never changes; it is the price that adjusts to the market rate.", "notes": "Entries: issue Dr Cash / Cr Bonds Payable; interest Dr Interest Expense / Cr Cash; maturity Dr Bonds Payable / Cr Cash. Types: secured (lower interest) vs unsecured debentures; term (one maturity date) vs serial (instalments); convertible (holder's option to convert to shares) vs callable (issuer's option to retire early). Market rate = effective rate = investors' required return."}, {"id": "T7-09", "topic": "T7", "title": "Instalment note: interest then principal", "kind": "formula", "bullets": ["Interest expense = unpaid principal at start of period x rate", "Principal reduction = payment - interest expense", "New balance = old balance - principal reduction", "Interest portion falls each year; principal portion rises", "Year-end accrue interest payable; at payment debit Interest Payable and Note Payable"], "visual": {"type": "table", "header": ["ABC: 500,000 at 6%, 118,700 a year", "Interest 6% x opening", "Principal", "Unpaid balance"], "rows": [["1 Jan 2026", "", "", "500,000.00"], ["1 Jan 2027", "30,000.00", "88,700.00", "411,300.00"], ["1 Jan 2028", "24,678.00", "94,022.00", "317,278.00"], ["1 Jan 2029", "19,036.68", "99,663.32", "217,614.68"], ["1 Jan 2030", "13,056.88", "105,643.12", "111,971.56"], ["1 Jan 2031", "6,718.29", "111,971.56", "0.00"]]}, "tip": "Cobalt Q21: 200,000 at 8%, payment 50,091. Year 1 interest 16,000, principal 34,091, balance 165,909. Year 2 interest 13,273, principal 36,818.", "trap": "Q21 distractors: year-2 interest (13,273), year-1 principal (34,091), the whole payment (50,091).", "notes": "The PV calculation of the payment is not tested; the split is. Recompute the unpaid balance before the second year's interest. Prof's note: a question may ask whether interest is higher or lower in a later year (lower). King's Inn: 75,815.7 x 10% = 7,581.6 interest, 12,418.4 principal, balance 63,397.3."}, {"id": "T7-10", "topic": "T7", "title": "Leases: basic understanding only", "kind": "je", "bullets": ["Lessee records a right-of-use asset and a lease liability at PV of payments", "ROU asset depreciated straight line over the shorter of lease term and useful life", "Each payment = interest expense + reduction of the liability", "Two expense lines: depreciation and interest", "Exceptions: short-term (under 1 year) and low-value leases"], "visual": {"type": "je", "rows": [{"event": "Commencement: PV of five 10,000 payments at 5% = 43,295", "dr": "ROU Asset 43,295", "cr": "Lease Liability 43,295"}, {"event": "Year-end depreciation 43,295 / 5", "dr": "Depreciation Expense 8,659", "cr": "Accumulated Depreciation, ROU Asset 8,659"}, {"event": "Payment: interest 43,295 x 5% = 2,164.75", "dr": "Interest Expense 2,164.75; Lease Liability 7,835.25", "cr": "Cash 10,000"}]}, "trap": "Sample Q24 false option: 'each payment reduces the liability by the full amount, no interest'.", "notes": "The lease liability works like an instalment note: interest first, remainder reduces the liability, so interest falls each year while depreciation stays level. PV is given in any question. Expensing the whole payment as rent is wrong under IFRS 16."}, {"id": "T7-11", "topic": "T7", "title": "T7 traps", "kind": "trap", "bullets": ["Interest: months since the note date, never the full term", "Payment straddling years: Dr Interest Payable for last year's accrual", "Warranty expense = estimate; claims paid reduce the provision only", "Reasonably possible = disclose; probable + estimable = record best estimate", "Stated below market = discount; instalment interest falls each year"], "visual": {"type": "cards", "items": [{"title": "Sales tax", "text": "'Including tax' means split by (1 + rate). Tax is a liability, never revenue."}, {"title": "Current portion", "text": "Only principal due within 12 months; interest payable is separate."}, {"title": "Unearned revenue", "text": "Dr Unearned Revenue / Cr Revenue for the months delivered."}, {"title": "Lease", "text": "Payment = interest + principal; two expenses, not rent."}]}, "notes": "Prof Lin's liability distractors: full-term interest, wrong credit account (Notes Payable instead of Interest Payable), recording the amount claimed, recording 50% of a loss, calling the whole loan current."}, {"id": "T7-12", "topic": "T7", "title": "T7 summary", "kind": "summary", "bullets": ["Memorise: accrued interest and salaries entries; note payment at maturity", "Memorise: warranty two entries and the provision T-account", "Memorise: three contingency tests and the three outcomes", "Memorise: premium/par/discount table; instalment split formula; three lease entries", "Likely short answer: contingent liability, record vs disclose vs ignore"], "visual": {"type": "steps", "items": ["Define: a provision is recorded when a present obligation exists, payment is probable and the amount is reliably estimable", "Example: 60% chance of losing a patent case, best estimate 400,000: Dr Loss / Cr Provision 400,000; a reasonably possible loss is disclosed only", "Why: users need to see probable costs on the balance sheet without recording speculative amounts; remote risks are ignored"]}, "notes": "Second likely short answer: why record a liability and expense from an estimate? Define: matching requires the cost caused by this period's sales to be recognised now. Example: Dr Warranty Expense 6,000 / Cr Provision 6,000 at 6% of sales; claims later Dr Provision / Cr Inventory. Why: otherwise profit is overstated now and the cost lands in a later period."}, {"id": "T8-00", "topic": "T8", "title": "T8 Shareholders' equity", "kind": "section", "bullets": ["Shares 14.5 marks with T9; about 6 equity questions", "Tested: two equity accounts, share issuance (cash and non-cash), rights", "Tested: dividends (preferred split, declaration, stock dividend), treasury effects, EPS", "Key Learning Points covered: all 11 bullets of Topic 9 (equity)", "In-class: Ferguson, SMU Inc, Lakewood, Donut Republic, Ross EPS"], "notes": "Not tested: diluted EPS and detailed treasury stock journal entries. You must still know how each treasury transaction affects total equity. Prof writes the A/L/SE effect next to every entry; do the same."}, {"id": "T8-01", "topic": "T8", "title": "Share capital and issuing shares", "kind": "je", "bullets": ["Two equity accounts: Share Capital (paid in) and Retained Earnings (profits kept)", "Cash received is always the full issue price", "With par: Common Stock = par x shares; APIC = the rest", "No par: everything to Share Capital", "Non-cash: record the asset or service at MARKET value; APIC is the plug"], "visual": {"type": "je", "rows": [{"event": "Ferguson: 10,000 shares, 1 par, at par", "dr": "Cash 10,000", "cr": "Common Stock 10,000"}, {"event": "Ferguson: issued at 1.50", "dr": "Cash 15,000", "cr": "Common Stock 10,000; APIC 5,000"}, {"event": "No-par shares at 1.50", "dr": "Cash 15,000", "cr": "Share Capital 15,000"}, {"event": "Shares for equipment and building (slide 10)", "dr": "Equipment 4,000; Building 120,000", "cr": "Common Stock 15,000; APIC 109,000"}, {"event": "Shares for legal services billed 25,000", "dr": "Legal Expense 25,000", "cr": "Common Stock 2,500; APIC 22,500"}]}, "tip": "Why set par very low (Apple 0.00001)? Shares cannot be issued below par, and APIC can fund buybacks.", "trap": "Non-cash issuance: the asset's cost is its market value, not par x shares.", "notes": "Issuing shares grows assets and equity. Preferred stock may have its own APIC account. Authorised = issued + unissued; issued = outstanding + treasury; outstanding shares are the EPS denominator. Singapore has no par value and no authorised capital, but exam questions use the US framework."}, {"id": "T8-02", "topic": "T8", "title": "Common vs preferred: four rights", "kind": "concept", "bullets": ["Four rights: vote, dividends, liquidation, preemption", "Common has all four; residual owners, last in liquidation", "Preferred: dividends first, assets first in liquidation, fixed dividend", "Preferred: limited or no voting and preemption rights", "Why issue preferred: limit voting dilution, payment flexibility, attract investors"], "visual": {"type": "compare", "columns": [{"title": "Common (ordinary)", "lines": ["All four rights", "Benefit most if the firm succeeds", "Residual owners: paid last"]}, {"title": "Preferred (preference)", "lines": ["Dividends and liquidation priority", "Fixed dividend, like debt", "Usually no vote, no preemption"]}]}, "tip": "Preemption = right to buy your current % of any new issue to keep control.", "notes": "Liquidation rights apply only after all liabilities are paid. Preferred's lack of votes lets common shareholders keep control. Preferred dividends can be deferred (cumulative ones accumulate), and many preferred shares have no maturity, which gives the company more flexibility than debt. Likely matching question."}, {"id": "T8-03", "topic": "T8", "title": "Cash dividends: declare, then pay", "kind": "je", "bullets": ["No obligation until the board DECLARES; arrears are never a liability", "Declaration: Dr Retained Earnings / Cr Dividends Payable (SE down, L up)", "Payment: Dr Dividends Payable / Cr Cash (L down, A down)", "Combined effect: equity down, assets down", "Needs enough retained earnings AND enough cash"], "visual": {"type": "je", "rows": [{"event": "Board declares 10,000", "dr": "Retained Earnings 10,000", "cr": "Dividends Payable 10,000"}, {"event": "Date of record", "dr": "no entry", "cr": "no entry"}, {"event": "Payment date", "dr": "Dividends Payable 10,000", "cr": "Cash 10,000"}]}, "trap": "Sample Q2 false option: 'must record a liability for dividends in arrears before declaration'.", "notes": "Dividends in arrears on cumulative preferred are disclosed in the notes, not recorded. Payment does not reduce equity again; declaration already did. Liabilities are involved only in cash dividends among all equity transactions."}, {"id": "T8-04", "topic": "T8", "title": "Exercise: SMU Inc dividend split", "kind": "exercise", "bullets": ["5,000 preferred shares at 1.20 a year: entitlement 6,000", "100,000 common shares; no arrears before 2024", "Declared 5,000 in 2024 and 12,000 in 2025", "Split for noncumulative and cumulative preferred"], "visual": {"type": "table", "header": ["Year, total", "Noncumulative: Pref / Common", "Cumulative: Pref / Common"], "rows": [["2024, 5,000", "5,000 / 0 (1,000 shortfall lost)", "5,000 / 0 (1,000 in arrears)"], ["2025, 12,000", "6,000 / 6,000", "6,000 + 1,000 = 7,000 / 5,000"], ["Ridgeview Q7: 20,000 x 50 par x 6%, noncumulative, 150,000 declared", "60,000 / 90,000", "(cumulative would be 120,000 / 30,000)"]]}, "tip": "Method: annual entitlement = par x rate x shares; add arrears if cumulative; preferred first; common gets the rest.", "trap": "Q7 distractor 30,000 is the cumulative answer. Read 'noncumulative'.", "notes": "Preferred dividend is stated as a % of par or a fixed amount per share. Cumulative: unpaid dividends accumulate and must be paid before common receives anything. Noncumulative: a skipped year is lost forever."}, {"id": "T8-05", "topic": "T8", "title": "Stock dividends and stock splits", "kind": "concept", "bullets": ["Stock dividend: declaration needs NO entry; distribute at market value", "Dr Retained Earnings (shares x market) / Cr Common Stock (+ APIC if par)", "Total equity unchanged; no cash; no liability; more shares outstanding", "Stock split: no entry at all; only the share count changes", "Why: conserve cash, lower the share price for liquidity"], "visual": {"type": "compare", "columns": [{"title": "Lakewood 10% stock dividend", "lines": ["50,000 shares x 10% = 5,000 at 14 = 70,000", "Dr RE 70,000 / Cr Common Stock 70,000", "Paid-in 320,000; RE 50,000; total still 370,000"]}, {"title": "Sable Q16 with 1 par", "lines": ["40,000 shares x 25 = 1,000,000", "Dr RE 1,000,000 / Cr Common 40,000 / Cr APIC 960,000", "Total equity unchanged"]}]}, "trap": "Q16 distractors: RE down by par only; total equity down; cash down. Only RE moves to contributed capital.", "notes": "A stock dividend transfers retained earnings into share capital; nothing leaves the company. Declaring one creates no liability because no asset will be transferred. A 10-for-1 split turns 100 shares at 50 into 1,000 at about 5; par per share falls proportionately and no account changes."}, {"id": "T8-06", "topic": "T8", "title": "Treasury stock and total equity", "kind": "concept", "bullets": ["Treasury stock = own shares bought back; contra-equity, not an asset", "Recorded at cost (market price on purchase date); no votes, no dividends", "Repurchase: equity down by cost. Resale: equity up by cash received", "Never a gain or loss on resale; differences go to APIC", "Reissue as compensation or retire: no net effect on total equity"], "visual": {"type": "table", "header": ["Transaction", "Effect on total equity", "Example"], "rows": [["Repurchase 10,000 shares at 30", "Down 300,000", "Tern Q40"], ["Resell 4,000 at 26 (below cost)", "Up 104,000 (cash received)", "Net Tern: down 196,000"], ["Resell above or at cost", "Up by cash received", "Donut: 200 at 20 = up 4,000"], ["Reissue as employee compensation", "No net effect (expense down, contra removed)", ""], ["Retire treasury shares", "No net effect (reshuffle within equity)", ""]]}, "tip": "Why buy back: return surplus cash, employee share plans, raise EPS (fewer shares), signal underpricing, avoid takeover.", "trap": "Q40 distractors: cost only (300,000), the 16,000 'loss' (goes to APIC, not P&L), proceeds only.", "notes": "Treasury stock is an equity account because it is a transaction with shareholders, and owners' transactions never create profit. Issuing shares grows assets and equity; buying treasury shrinks both. Apple shows no treasury stock because it retires repurchased shares. Detailed treasury entries are not tested; the equity effects are."}, {"id": "T8-07", "topic": "T8", "title": "Exercise: Donut Republic", "kind": "exercise", "bullets": ["Jan 17: issue 2,200 shares, 2.50 par, at 10", "May 23: repurchase 300 shares at 12", "Jul 11: reissue 200 treasury shares at 20", "Find the entries and the net effect on equity"], "visual": {"type": "je", "rows": [{"event": "Jan 17 issue", "dr": "Cash 22,000", "cr": "Common Stock 5,500; APIC 16,500"}, {"event": "May 23 repurchase", "dr": "Treasury Stock 3,600", "cr": "Cash 3,600"}, {"event": "Jul 11 reissue 200 at 20 (cost 12)", "dr": "Cash 4,000", "cr": "Treasury Stock 2,400; APIC 1,600"}, {"event": "Net effect on equity", "dr": "+22,000 - 3,600 + 4,000", "cr": "= +22,400"}]}, "tip": "Net equity change always equals net cash exchanged with shareholders.", "notes": "Remaining treasury stock: 100 shares x 12 = 1,200 contra-equity. Resale below cost (treasury cost 500 resold at 300): Dr Cash 300, Dr APIC 200 / Cr Treasury Stock 500; equity still rises by the 300 cash."}, {"id": "T8-08", "topic": "T8", "title": "Basic EPS", "kind": "formula", "bullets": ["EPS = (Net income - preferred dividends) / weighted-average common shares outstanding", "Outstanding = issued - treasury", "Weight shares by the fraction of the year they were outstanding", "Subtract PREFERRED dividends only, never common", "Diluted EPS is not tested"], "visual": {"type": "equation", "text": "Basic EPS = (Net income - Preferred dividends) / Weighted-average shares outstanding", "sub": "Ross: (108,000 - 50,000 x 6%) / (52,000 - 2,000 treasury) = 105,000 / 50,000 = 2.10"}, "tip": "Osprey Q26: 1,000,000 + 300,000 x 6/12 = 1,150,000; (2,400,000 - 300,000) / 1,150,000 = 1.83.", "trap": "Q26 distractors: year-end shares (1.62), ignore preferred dividends (2.09), January shares (2.10).", "notes": "EPS measures earnings attributable to each common share. A buyback mid-year is weighted negatively: 200,000 shares less 40,000 repurchased Oct 1 = 200,000 - 40,000 x 3/12 = 190,000. Preferred dividend = par x rate x shares."}, {"id": "T8-09", "topic": "T8", "title": "Effects of equity transactions", "kind": "concept", "bullets": ["Only cash dividend declaration touches liabilities", "Stock dividends and splits change nothing in total", "Issuing shares and reselling treasury raise assets and equity", "Buying treasury lowers assets and equity", "Dividend payment lowers assets and liabilities, not equity"], "visual": {"type": "table", "header": ["Transaction", "Assets", "Liabilities", "Equity"], "rows": [["Issue shares", "+", "none", "+"], ["Purchase treasury shares", "-", "none", "-"], ["Sell treasury shares", "+", "none", "+"], ["Declare cash dividend", "none", "+", "-"], ["Pay cash dividend", "-", "-", "none"], ["Stock dividend or stock split", "none", "none", "none (RE to Common Stock)"]]}, "tip": "Memorise this table; it answers most 'effect on' questions in T8.", "notes": "Prof's annotation: these are mostly transactions with shareholders, and a liability is involved only in cash dividends. Drill: declare 20,000 (L +20,000, E -20,000); pay (A -20,000, L -20,000); combined A -20,000, E -20,000."}, {"id": "T8-10", "topic": "T8", "title": "T8 traps", "kind": "trap", "bullets": ["Dividends in arrears: disclose, never a liability until declared", "Noncumulative preferred gets no arrears", "Stock dividend: RE down, total equity unchanged, no cash", "Treasury resale below cost: no loss; equity up by cash received", "EPS: weighted outstanding shares; subtract preferred dividends only"], "visual": {"type": "cards", "items": [{"title": "Preferred dividend", "text": "Par x rate x shares. Not total dollars divided by shares."}, {"title": "Non-cash issuance", "text": "Asset at market value; APIC is the plug."}, {"title": "Treasury is not an asset", "text": "Contra-equity at cost; no votes, no dividends."}, {"title": "Stock split", "text": "No entry, no account changes, only share count."}]}, "notes": "Prof's favourite 'no change' answers here: stock dividend leaves total equity unchanged; treasury resale creates no gain or loss; dividend payment leaves equity unchanged."}, {"id": "T8-11", "topic": "T8", "title": "T8 summary", "kind": "summary", "bullets": ["Memorise: issuance entries with par and APIC", "Memorise: dividend split method; declaration and payment entries", "Memorise: stock dividend at market, total equity unchanged", "Memorise: treasury effects table; EPS formula", "Likely short answer: why is treasury stock contra-equity; why buy back?"], "visual": {"type": "steps", "items": ["Define: treasury stock is the company's own issued shares bought back, recorded at cost and deducted from equity", "Example: buy 1,000 shares at 20: Dr Treasury Stock 20,000 / Cr Cash 20,000; equity and assets both fall", "Why: it is a transaction with owners, not an asset or a profit; firms buy back to return cash, fund employee plans, raise EPS or signal underpricing"]}, "notes": "Second likely short answer: why does a stock dividend not change total equity? Define: shares distributed in place of cash, recorded at market value. Example: Dr RE 70,000 / Cr Common Stock 70,000. Why: it only moves retained earnings into share capital; no asset leaves and no liability is created."}, {"id": "T9-00", "topic": "T9", "title": "T9 Statement of cash flows", "kind": "section", "bullets": ["Shares 14.5 marks with T8; about 4 questions", "Tested: three categories and their meaning, classify single-classification items", "Tested: direct vs indirect (operating only), non-cash activities in a note", "Key Learning Points covered: all 5 bullets of Topic 10 (cash flows)", "Not tested: preparing a full statement, interest/dividend classification, US rules, IFRS 18"], "notes": "The Key Learning Points doc calls this Topic 10; it IS tested, unlike the Topic 10 Fundamental Analysis deck. Questions are conceptual: classify an item, identify the method, spot the non-cash activity."}, {"id": "T9-01", "topic": "T9", "title": "Three categories and their drivers", "kind": "concept", "bullets": ["Operating: day-to-day selling of goods and services", "Investing: buying and selling long-term assets and investments", "Financing: cash from or to owners and creditors", "Balance sheet link: current items operating; long-term assets investing; LTD and equity financing", "CFO + CFI + CFF = change in cash; ending cash = balance-sheet cash"], "visual": {"type": "table", "header": ["Activity", "Inflows", "Outflows"], "rows": [["Operating", "Collections from customers", "Suppliers, employees, income tax, other expenses"], ["Investing", "Sale of PP&E; sale of investments; loan principal collected", "Buy PP&E; buy investments; make loans"], ["Financing", "Issue shares; resell treasury; borrow", "Buy treasury shares; repay principal; pay dividends"]]}, "trap": "Repurchase of own shares is FINANCING (sample Q22). Buying another firm's bonds is INVESTING.", "notes": "Investing also covers short-term and long-term investments. Dividends paid are financing in common practice. Interest paid or received and dividends received have more than one permitted classification and are not tested. Depreciation is not a cash flow; under the indirect method it is only added back."}, {"id": "T9-02", "topic": "T9", "title": "Exercise: classify each cash flow", "kind": "exercise", "bullets": ["O = operating, I = investing, F = financing, N = non-cash note", "X = not on the statement at all", "Twelve items in the in-class style", "Likely matching question format"], "visual": {"type": "table", "header": ["Item", "Class", "Item", "Class"], "rows": [["Cash paid to employees (midterm Q9)", "O", "Issue common shares for cash", "F"], ["Purchase equipment for cash", "I", "Repay bank loan principal", "F"], ["Proceeds from selling used equipment", "I", "Pay cash dividends", "F"], ["Buy another company's bonds", "I", "Land acquired by issuing a note", "N"], ["Collect loan principal from another firm", "I", "Building acquired by issuing shares (Q6)", "N"], ["Cash paid to suppliers", "O", "Stock dividend, write-off, depreciation", "X"]]}, "tip": "Non-cash note items have FUTURE cash implications (the note will be paid); stock dividends have none.", "notes": "Prof distinguished two kinds of non-cash items: no current or future cash effect (stock dividend, split, write-off, depreciation) and no current but future cash effect (land for a note, bonds converted to shares). Declaring a dividend is not a cash flow until paid."}, {"id": "T9-03", "topic": "T9", "title": "What each category tells you", "kind": "concept", "bullets": ["Operating: sustainable cash and working-capital management; must be positive long-run", "Red flag: net income rises while CFO falls (earnings not cash-backed)", "Investing: spending on future capacity; asset sales are one-off inflows", "Financing: how the firm funds itself; growth firms borrow, mature firms repay", "Free cash flow = CFO - capital expenditure"], "visual": {"type": "cards", "items": [{"title": "Operating", "text": "Earnings quality: compare NI with CFO. Harbor: NI 120, CFO 60, ratio 0.50."}, {"title": "Investing", "text": "FCF = CFO - CapEx. Harbor FY2025: 60 - 50 = 10."}, {"title": "Financing", "text": "Internal vs external funding; signals maturity of the firm."}, {"title": "Patterns", "text": "+/-/- mature; +/-/+ growth; -/-/+ start-up; -/+/- distress."}]}, "trap": "Do not deduct interest or tax again when computing FCF; they are already inside CFO.", "notes": "A company cannot raise cash from financing forever; it must generate operating cash. Signs are clues, not conclusions: check amounts, transactions and trends. CFO/NI is 'not meaningful' when NI is a loss."}, {"id": "T9-04", "topic": "T9", "title": "Direct vs indirect: operating only", "kind": "concept", "bullets": ["Direct: lists actual receipts and payments (customers, suppliers, employees, tax)", "Indirect: starts from net income, adds back non-cash items, adjusts working capital", "Investing and financing are ALWAYS direct", "Direct is IASB-preferred but rarely used", "Spot the method from the first line of the operating section"], "visual": {"type": "compare", "columns": [{"title": "Direct method", "lines": ["Cash collected from customers 950", "Cash paid to suppliers (600), employees (150), tax (40)", "Net CFO 160"]}, {"title": "Indirect method", "lines": ["Net income 120", "+ depreciation 20, - receivables increase 50, - inventory increase 40, + payables increase 10", "Net CFO 60"]}]}, "tip": "Sign rules: add depreciation and losses; subtract gains; subtract current-asset increases; add current-liability increases.", "trap": "Sample Q1: operating section starts with net income = indirect; investing and financing still direct.", "notes": "Gains on asset sales are subtracted from net income because the full proceeds already sit in investing; otherwise they are double counted. Depreciation reduced profit but used no cash, so it is added back. You will not be asked to prepare a full statement, only to identify the method and classify items."}, {"id": "T9-05", "topic": "T9", "title": "Non-cash investing and financing", "kind": "concept", "bullets": ["Some investing and financing activities involve no cash", "Examples: land for a note payable; building for shares; debt retired by issuing stock", "Also: preferred converted to common; equipment for a short-term note", "Report in a separate schedule or note, NOT in the statement body", "Why: users still need to know about the investment and the financing"], "visual": {"type": "table", "header": ["Slide example schedule", "Amount"], "rows": [["Building acquired by issuing common stock", "320"], ["Land acquired by issuing note payable", "72"], ["Debt paid by transferring investments to creditor", "104"], ["Equipment acquired by short-term note", "37"], ["Total non-cash investing and financing", "533"]]}, "trap": "Sample Q6: land for shares is the note item; equipment for cash, dividends paid and loan collections are in the body.", "notes": "These transactions change long-term assets and long-term financing at the same time without cash moving now, though cash usually moves later when the note is paid. Stock dividends and splits are pure equity reshuffles and are not reported at all."}, {"id": "T9-06", "topic": "T9", "title": "T9 traps", "kind": "trap", "bullets": ["Direct vs indirect applies to operating only", "Buying own shares = financing; selling equipment = investing (full proceeds)", "Non-cash land-for-shares = note disclosure, not the statement body", "Depreciation is an add-back, not a cash inflow", "Dividend declaration is not a cash flow; payment is financing"], "visual": {"type": "cards", "items": [{"title": "Another firm's bonds", "text": "Investing outflow, not financing."}, {"title": "Gain on sale", "text": "Subtract from NI under indirect; proceeds are in investing."}, {"title": "Ending cash", "text": "Must equal the balance-sheet cash (statement link)."}, {"title": "FCF", "text": "CFO minus CapEx; interest and tax already inside CFO."}]}, "notes": "Prof Lin's cash-flow distractors swap investing and financing (own shares vs other firms' securities) and put non-cash items in the body of the statement."}, {"id": "T9-07", "topic": "T9", "title": "T9 summary", "kind": "summary", "bullets": ["Memorise: operating / investing / financing sorter with balance-sheet drivers", "Memorise: investing and financing always direct", "Memorise: four non-cash examples go in a note", "Memorise: CFO + CFI + CFF = change in cash", "Likely short answer: three categories, implications, non-cash examples"], "visual": {"type": "steps", "items": ["Define: operating = day-to-day business; investing = long-term assets and investments; financing = owners and creditors", "Example: paying suppliers (O); buying equipment (I); repurchasing own shares (F); land for a note = non-cash note", "Why: CFO shows sustainable cash and earnings quality; CFI shows reinvestment; CFF shows how the firm is funded"]}, "notes": "Second likely short answer: direct vs indirect. Define: both reach the same CFO; direct lists receipts and payments, indirect reconciles from net income. Example: indirect adds back depreciation 20 and subtracts a receivables increase 50. Why: indirect shows why profit differs from cash; investing and financing are always direct."}, {"id": "C-01", "topic": "C", "title": "Ten most likely short-answer questions", "kind": "summary", "bullets": ["Five will appear at 3 marks each; answer in three bullets", "Bullet 1: textbook definition", "Bullet 2: concrete example with the entry or over/understatement", "Bullet 3: why it matters, naming a principle or the user", "Marks are per element; coverage beats polish"], "visual": {"type": "table", "header": ["#", "Question", "#", "Question"], "rows": [["1", "Why Accumulated Depreciation instead of crediting PP&E?", "6", "Three cash-flow categories, implications, non-cash examples"], ["2", "Why record a liability and expense from an estimate?", "7", "What is GAAP and why important; revenue vs gain"], ["3", "Purpose of adjusting entries; effect if missed", "8", "FIFO vs LIFO in inflation; why LIFO is banned"], ["4", "Why close temporary accounts; what RE means; dividends not expense", "9", "Goodwill impairment; IFRS research vs development"], ["5", "Contingent liability: record, disclose or ignore", "10", "Treasury stock as contra-equity; why buy back; stock dividend"]]}, "tip": "Your midterm answer on matching scored 5/5 with exactly this structure: define, two examples, why.", "notes": "Also plausible: accrual vs cash basis with numbers (Lumen), what 'net' means in A/R net, PP&E net and net sales, and the difference between revenue and gain. Write the principle's name (matching, time period, revenue recognition) in every answer."}, {"id": "C-02", "topic": "C", "title": "Exam-day tactics", "kind": "concept", "bullets": ["Redraw the memory graphics on scrap paper as soon as the exam opens", "Do questions in order; skip anything over 2 minutes and flag it", "'Which is FALSE': tick the three true statements first", "Every plug: draw the T-account; every interest: write the months", "Short answers last 25 minutes: three bullets each, name the principle"], "visual": {"type": "steps", "items": ["0 to 80 min: 52 MCQs at 1.5 min each; flag and move on", "80 to 90 min: two matching questions", "90 to 115 min: five short answers, three bullets each", "115 to 120 min: return to flagged MCQs; never leave a blank"]}, "trap": "Your eight midterm errors were all direction slips. Say the rule aloud before you click.", "notes": "Closed book, no cheat sheet, own calculator allowed, scrap paper provided. If the lockdown browser fails, close it and re-enter the quiz. The paper is shuffled across topics, so expect to context-switch. Prof's distractors are predictable: full-term interest, desired balance instead of expense, periodic instead of perpetual, book value instead of fair value, forgetting the partial year."}]</script>
<script>
(function(){
'use strict';
const SL=JSON.parse(document.getElementById('sdata').textContent);
const TOPICS=[["O","Start here: exam and big picture"],["T1","Financial statements overview"],["T2","Accounting cycle 1"],["T3","Accounting cycle 2: adjusting, closing"],["T4","Receivables"],["T5","Inventory and COGS"],["T6","PP&E and intangibles"],["T7","Liabilities"],["T8","Shareholders' equity"],["T9","Statement of cash flows"],["C","Closing: short answers and tactics"]];
const TN=Object.fromEntries(TOPICS);
const $=s=>document.querySelector(s);const app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function lsGet(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
let S=lsGet('acct689.prep',{done:{},bm:{},last:0});
const save=()=>lsSet('acct689.prep',S);
function applyTheme(){const t=lsGet('acct689.theme','');if(t)document.documentElement.setAttribute('data-theme',t);else document.documentElement.removeAttribute('data-theme')}
applyTheme();
$('#btnTheme').onclick=()=>{const cur=document.documentElement.getAttribute('data-theme');const dark=cur?cur==='dark':matchMedia('(prefers-color-scheme:dark)').matches;lsSet('acct689.theme',dark?'light':'dark');applyTheme()};
$('#btnHome').onclick=home;
$('#jump').innerHTML='<option value="">Jump to topic…</option>'+TOPICS.map(t=>`<option value="${t[0]}">${t[0]==='O'||t[0]==='C'?'':t[0]+' · '}${esc(t[1])}</option>`).join('');
$('#jump').onchange=e=>{if(e.target.value){openTopic(e.target.value);e.target.value=''}};
let toastT;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),1600)}
const idx=Object.fromEntries(SL.map((s,i)=>[s.id,i]));
function tstats(t){const ss=SL.filter(s=>s.topic===t);return{n:ss.length,done:ss.filter(s=>S.done[s.id]).length,bm:ss.filter(s=>S.bm[s.id]).length}}

/* ---- visuals ---- */
const num=v=>/^[\s$£€¥(−\-]*[\d,.]+[\s%)]*$/.test(String(v).trim());
function vis(v){
  if(!v)return '';
  switch(v.type){
    case 'table':return `<table class="tb"><thead><tr>${(v.header||[]).map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${(v.rows||[]).map(r=>`<tr>${r.map(c=>`<td class="${num(c)?'n':''}">${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
    case 'flow':return `<div class="flow">${v.nodes.map((n,i)=>`<div class="n">${esc(n)}</div>${i<v.nodes.length-1?`<div class="a"><b>→</b>${v.labels&&v.labels[i]?`<span>${esc(v.labels[i])}</span>`:''}</div>`:''}`).join('')}</div>`;
    case 'compare':return `<div class="cmp">${v.columns.map(c=>`<div><h4>${esc(c.title)}</h4>${c.lines.map(l=>`<p>${esc(l)}</p>`).join('')}</div>`).join('')}</div>`;
    case 'tacct':return `<div class="tacct"><div class="h">${esc(v.title)}</div><div class="b"><div>${(v.left||[]).map(esc).join('<br>')||'&nbsp;'}</div><div>${(v.right||[]).map(esc).join('<br>')||'&nbsp;'}</div></div><div class="cap">debit side · credit side</div>${v.balance?`<div class="bal">${esc(v.balance)}</div>`:''}</div>`;
    case 'equation':return `<div class="eq">${esc(v.text)}${v.sub?`<small>${esc(v.sub)}</small>`:''}</div>`;
    case 'steps':return `<ol class="steps">${v.items.map(i=>`<li>${esc(i.replace(/^\d+[.)]\s*/,''))}</li>`).join('')}</ol>`;
    case 'grid2x2':return `<div class="g22"><div class="h"></div>${v.colLabels.map(c=>`<div class="h">${esc(c)}</div>`).join('')}${v.rowLabels.map((r,i)=>`<div class="r">${esc(r)}</div>${v.cells[i].map(c=>`<div class="c">${esc(c)}</div>`).join('')}`).join('')}</div>`;
    case 'cards':return `<div class="cards">${v.items.map(c=>`<div><b>${esc(c.title)}</b>${esc(c.text)}</div>`).join('')}</div>`;
    case 'je':return `<table class="je">${v.rows.map(r=>`<tr><td style="width:38%"><b>${esc(r.event)}</b></td><td><div class="dr">Dr ${esc(r.dr)}</div><div class="cr">Cr ${esc(r.cr)}</div></td></tr>`).join('')}</table>`;
  }
  return '';
}

/* ---- views ---- */
function home(){
  const total=SL.length,done=Object.keys(S.done).filter(k=>S.done[k]&&idx[k]!==undefined).length,bm=Object.keys(S.bm).filter(k=>S.bm[k]&&idx[k]!==undefined).length;
  const pct=total?Math.round(100*done/total):0,days=Math.ceil((new Date('2026-11-12T00:00:00+08:00')-Date.now())/864e5);
  app.innerHTML=`<div class="card hero"><div class="hero-grid"><div><div class="eyebrow">Revision slides · Final 12 Nov 2026</div><h1>ACCT689 Exam Prep</h1>
  <div class="stats"><div class="stat"><b>${days>0?days:'Go!'}</b>${days>1?'days to go':days===1?'day to go':'exam time'}</div><div class="stat"><b>${done}<small style="font-size:.9rem;opacity:.7">/${total}</small></b>slides read</div><div class="stat"><b>${bm}</b>bookmarked</div></div><div class="hbar" aria-hidden="true"><i style="width:${pct}%"></i></div></div>
  <div class="ring" style="--p:${pct}" role="img" aria-label="${pct} percent read"><span><b>${pct}%</b><small>read</small></span></div></div>
  <div class="row" style="margin-top:20px"><button class="btn light" id="btnContinue" type="button">${S.last?'Continue where I stopped →':'Start from the beginning →'}</button><button class="btn glass" id="btnUnread" type="button">Next unread</button><button class="btn glass" id="btnBm" type="button">Bookmarked (${bm})</button></div></div>
  <div class="card" style="margin-top:16px"><input class="search" id="q" type="search" placeholder="Search slides (e.g. warranty, FIFO, goodwill)…" aria-label="Search slides"><ul class="list" id="res"></ul></div>
  <div class="card" style="margin-top:16px"><div class="sec-h"><h3>Topics</h3><span class="subtle">in course order</span></div><div class="grid" style="margin-top:14px">${TOPICS.map(t=>{const s=tstats(t[0]),full=s.n&&s.done===s.n;return `<button class="topic ${full?'complete':s.done?'started':''}" data-t="${t[0]}" type="button"><span class="badge">${full?'✓':t[0]==='O'?'▶':t[0]==='C'?'★':t[0].slice(1)}</span><span class="tb2"><div class="t">${esc(t[1])}</div><div class="m">${s.n} slides · ${s.done} read${s.bm?' · '+s.bm+' ⚑':''}</div><div class="bar"><i style="width:${s.n?100*s.done/s.n:0}%"></i></div></span></button>`}).join('')}</div></div>
  <div class="card" style="margin-top:16px"><div class="eyebrow">Move progress between phone and laptop</div><p class="subtle" style="margin:6px 0">Copy this code on one device and paste it on the other, then press Import.</p><textarea class="code" id="code" aria-label="Progress code">${esc(btoa(unescape(encodeURIComponent(JSON.stringify(S)))))}</textarea><div class="row" style="margin-top:8px"><button class="btn sm ghost" id="btnCopy" type="button">Copy code</button><button class="btn sm" id="btnImport" type="button">Import pasted code</button><button class="btn sm ghost" id="btnReset" type="button">Reset progress</button></div></div>
  <p class="subtle" style="margin-top:14px">Keyboard: <span class="kbd">→</span> next, <span class="kbd">←</span> back, <span class="kbd">D</span> mark read, <span class="kbd">B</span> bookmark.</p>`;
  $('#btnContinue').onclick=()=>show(S.last||0);
  $('#btnBm').onclick=()=>{const l=SL.map((s,i)=>i).filter(i=>S.bm[SL[i].id]);if(!l.length)return toast('No bookmarks yet. Press B on a slide.');list('Bookmarked slides',l)};
  $('#btnUnread').onclick=()=>{const i=SL.findIndex(s=>!S.done[s.id]);if(i<0)return toast('Everything is read. Go do the quiz.');show(i)};
  app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>openTopic(b.dataset.t));
  $('#q').oninput=e=>{const v=e.target.value.trim().toLowerCase();const r=$('#res');if(v.length<2){r.innerHTML='';return}const hits=SL.map((s,i)=>({s,i})).filter(({s})=>(s.title+' '+s.bullets.join(' ')+' '+(s.notes||'')+' '+JSON.stringify(s.visual||'')).toLowerCase().includes(v)).slice(0,15);r.innerHTML=hits.map(({s,i})=>`<li class="${S.done[s.id]?'done':''} ${S.bm[s.id]?'bm':''}"><span class="t">${s.topic} · ${esc(s.title)}</span><button class="btn sm ghost" data-i="${i}" type="button">Open</button></li>`).join('')||'<li class="subtle">No matches</li>';r.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>show(+b.dataset.i))};
  $('#btnCopy').onclick=()=>{const t=$('#code').value;navigator.clipboard.writeText(t).then(()=>toast('Copied')).catch(()=>{$('#code').select();toast('Select and copy the code')})};
  $('#btnImport').onclick=()=>{try{const o=JSON.parse(decodeURIComponent(escape(atob($('#code').value.trim()))));if(!o||typeof o!=='object'||!o.done)throw 0;S={done:{...S.done,...o.done},bm:{...S.bm,...o.bm},last:o.last||S.last};save();toast('Progress imported');home()}catch(e){toast('That code did not work. Paste the whole code.')}};
  $('#btnReset').onclick=()=>{if($('#btnReset').dataset.c){S={done:{},bm:{},last:0};save();home();toast('Progress reset')}else{$('#btnReset').textContent='Press again to confirm reset';$('#btnReset').dataset.c='1'}};
  window.scrollTo(0,0);
}
function openTopic(t){const l=SL.map((s,i)=>i).filter(i=>SL[i].topic===t);list((t==='O'||t==='C'?'':t+' · ')+TN[t],l)}
function list(title,ids){
  app.innerHTML=`<div class="card"><div class="eyebrow">Slide list</div><h2>${esc(title)}</h2><div class="row" style="margin-top:10px"><button class="btn" id="btnFirst" type="button">Read from the first slide</button><button class="btn ghost" id="btnBack" type="button">Home</button></div><ul class="list">${ids.map(i=>{const s=SL[i];return `<li class="${S.done[s.id]?'done':''} ${S.bm[s.id]?'bm':''}"><span class="t"><span class="chip k">${esc(s.kind)}</span> ${esc(s.title)}</span><button class="btn sm ghost" data-i="${i}" type="button">Open</button></li>`}).join('')}</ul></div>`;
  $('#btnFirst').onclick=()=>show(ids[0],ids);$('#btnBack').onclick=home;app.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>show(+b.dataset.i,ids));window.scrollTo(0,0);
}
let SEQ=null,CUR=0;
function show(i,seq){
  SEQ=seq||null;CUR=i;const s=SL[i];S.last=i;save();
  const pos=SEQ?SEQ.indexOf(i):i,n=SEQ?SEQ.length:SL.length;
  const tseq=SL.map((x,j)=>j).filter(j=>SL[j].topic===s.topic);
  app.innerHTML=`<div class="card slide k-${esc(s.kind)}"><div class="row" style="justify-content:space-between"><div class="row"><span class="chip">${s.topic==='O'||s.topic==='C'?'':s.topic+' · '}${esc(TN[s.topic])}</span><span class="chip ${s.kind==='exercise'?'ex':s.kind==='trap'?'tr':'k'}">${esc(s.kind)}</span></div><span class="subtle">${pos+1} / ${n}</span></div>
  <div class="dots">${tseq.map(j=>`<i class="${S.done[SL[j].id]?'d':''} ${S.bm[SL[j].id]?'b':''} ${j===i?'cur':''}" data-j="${j}" title="${esc(SL[j].title)}"></i>`).join('')}</div>
  <h2>${esc(s.title)}</h2>${s.subtitle?`<div class="sub">${esc(s.subtitle)}</div>`:''}
  <ul>${s.bullets.map(b=>`<li>${esc(b)}</li>`).join('')}</ul>
  ${s.visual?`<div class="vis">${vis(s.visual)}</div>`:''}
  ${s.tip?`<div class="tip"><b>Tip.</b> ${esc(s.tip)}</div>`:''}${s.trap?`<div class="trap"><b>Trap.</b> ${esc(s.trap)}</div>`:''}
  ${s.notes?`<details class="notes" ${s.kind==='summary'||s.kind==='exercise'?'open':''}><summary>Explain it to me</summary><p>${esc(s.notes)}</p></details>`:''}
  <div class="acts"><button class="tog done ${S.done[s.id]?'on':''}" id="tDone" type="button" aria-pressed="${!!S.done[s.id]}">${S.done[s.id]?'✓ Read':'Mark as read'}</button><button class="tog ${S.bm[s.id]?'on':''}" id="tBm" type="button" aria-pressed="${!!S.bm[s.id]}">${S.bm[s.id]?'⚑ Bookmarked':'⚐ Bookmark to revisit'}</button></div>
  <div class="nav"><button class="btn ghost" id="bPrev" type="button" ${pos===0?'disabled':''}>← Back</button><button class="btn ghost" id="bList" type="button">Topic list</button><button class="btn" id="bNext" type="button">${pos===n-1?'Done':'Next →'}</button></div></div>`;
  $('#tDone').onclick=()=>{S.done[s.id]=!S.done[s.id];save();show(i,SEQ)};
  $('#tBm').onclick=()=>{S.bm[s.id]=!S.bm[s.id];save();toast(S.bm[s.id]?'Bookmarked':'Bookmark removed');show(i,SEQ)};
  $('#bPrev').onclick=prev;$('#bNext').onclick=next;$('#bList').onclick=()=>openTopic(s.topic);
  app.querySelectorAll('.dots i').forEach(d=>d.onclick=()=>show(+d.dataset.j,SEQ));
  window.scrollTo(0,0);
}
function next(){const s=SL[CUR];if(!S.done[s.id]){S.done[s.id]=true;save()}if(SEQ){const p=SEQ.indexOf(CUR);if(p<SEQ.length-1)show(SEQ[p+1],SEQ);else{toast('Section finished. Nice work.');home()}}else{if(CUR<SL.length-1)show(CUR+1);else{toast('You reached the end. Go do the quiz.');home()}}}
function prev(){if(SEQ){const p=SEQ.indexOf(CUR);if(p>0)show(SEQ[p-1],SEQ)}else if(CUR>0)show(CUR-1)}
document.addEventListener('keydown',e=>{if(!$('#bNext'))return;if(['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev();if(e.key.toLowerCase()==='d')$('#tDone').click();if(e.key.toLowerCase()==='b')$('#tBm').click()});
let tx=null;document.addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});document.addEventListener('touchend',e=>{if(tx==null||!$('#bNext'))return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>70){dx<0?next():prev()}tx=null});
home();

/* ---- install as app ---- */
let deferred=null;const ib=$('#btnInstall');
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone;
const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;ib.hidden=false});
addEventListener('appinstalled',()=>{ib.hidden=true;toast('Installed. Find it on your Home Screen.')});
if(ios&&!standalone)ib.hidden=false;
ib.onclick=async()=>{if(deferred){deferred.prompt();await deferred.userChoice;deferred=null;ib.hidden=true}else $('#sheet').classList.add('show')};
$('#sheetClose').onclick=()=>$('#sheet').classList.remove('show');
$('#sheet').onclick=e=>{if(e.target.id==='sheet')$('#sheet').classList.remove('show')};
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('/sw.js').catch(()=>{}));
})();
</script>

</body>
